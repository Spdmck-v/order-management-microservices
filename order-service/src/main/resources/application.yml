server:
  port: 8081

spring:
  application:
    name: order-service
  reactor:
    context-propagation: auto
  r2dbc:
    url: r2dbc:postgresql://${ORDERS_DB_HOST:localhost}:${ORDERS_DB_PORT:5433}/${ORDERS_DB_NAME:orders_db}
    username: ${ORDERS_DB_USER:postgres}
    password: ${ORDERS_DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 2
      max-size: 10
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema.sql

inventory:
  base-url: ${INVENTORY_BASE_URL:http://inventory-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
