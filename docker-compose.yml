services:
  orders-db:
    image: postgres:16
    container_name: orders-db
    environment:
      POSTGRES_DB: ${ORDERS_DB_NAME:-orders_db}
      POSTGRES_USER: ${ORDERS_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${ORDERS_DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    networks:
      - ecommerce-net
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ORDERS_DB_USER:-postgres} -d ${ORDERS_DB_NAME:-orders_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:16
    container_name: inventory-db
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory_db}
      POSTGRES_USER: ${INVENTORY_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    networks:
      - ecommerce-net
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER:-postgres} -d ${INVENTORY_DB_NAME:-inventory_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  inventory-service:
    build: ./inventory-service
    image: order-mgmt/inventory-service:latest
    container_name: inventory-service
    environment:
      INVENTORY_DB_HOST: ${INVENTORY_DB_HOST:-inventory-db}
      INVENTORY_DB_PORT: ${INVENTORY_DB_PORT:-5432}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory_db}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-postgres}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:-postgres}
    depends_on:
      inventory-db:
        condition: service_healthy
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.1
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    networks:
      - ecommerce-net
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/live HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  ecommerce-net:
    driver: bridge

volumes:
  orders-db-data:
  inventory-db-data:
